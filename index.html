${H('Help & Instructions')}${[['1. Getting started','<b>Create account</b> with your name, username, Gmail and mobile number, or <b>log in</b> with any one of username, Gmail or mobile. Then choose your field (Photography, Photo &amp; Video Editing, Medical, Library, Education, Web &amp; IT, Interior, Events, Legal, Salon, Design &amp; Marketing, Real Estate, Fitness, Travel, Home Services or General) and tap a template. Everything is stored on this device only.'],['2. Editing your quotation','Open each section in the editor: <b>1 Studio &amp; Client</b> (logo, business details, client name/mobile/email, extra custom fields), <b>2 Services or Events</b> (use + / − for quantities, quick-add chips or your own item, reorder with the arrows), <b>3 Deliverables</b>, <b>4 Important notes</b>, <b>5 Cost &amp; Payment</b> and <b>6 Terms &amp; Cancellation</b>. On a phone use the <b>Edit</b> / <b>Preview</b> buttons; on a computer both show side by side.'],['3. Pricing &amp; payment','Choose a single package price or item-wise pricing, then add a discount and GST (0, 5, 12 or 18%). Payment milestones are set in <b>percentages</b>; the last one automatically balances to 100%. Add your UPI ID, upload a payment QR code and bank details to show them on the quotation.'],['4. Designs, textures &amp; colours','Pick a style at the top of the editor: Minimal, Gold, Botanical, Editorial, <b>Textured Paper, Kraft Linen</b>, <b>Watercolor Blush / Ocean</b> and the traditional art styles <b>Warli, Madhubani, Mandala and Mughal Paisley</b>. In <b>Backgrounds</b> you can upload your own background with a readability slider, add a featured photo (Editorial style) and change the accent colour.'],['5. Logo &amp; background remover','Upload your logo in section 1, then tap <b>Remove background</b> to make a plain-colour background transparent. <b>Restore</b> brings the original back. It works best on logos with a solid background; for complex photos, remove the background with an online tool first and then upload the result.'],['6. Saving &amp; templates','Tap <b>Save</b> to save your work. Tap <b>Save as My Template</b> to keep the design and items as a reusable template: it appears at the top of the template page under <b>⭐ My Templates</b>. There, tap <b>Use</b> to start a fresh quotation from it (client details are cleared), <b>Edit</b> to change the template itself (then <b>Save</b> updates it), <b>Copy</b> to duplicate or ✕ to delete. Use <b>Export backup</b> to keep a file and <b>Import backup</b> to restore it on another device.'],['7. Sharing as PDF','Tap <b>Share PDF</b>. The quotation is laid out on real A4 or Letter pages (choose the <b>Paper size</b> at the top of the editor) and continues onto as many pages as needed, with page numbers. On a phone the share sheet opens so you can send the PDF by WhatsApp, email or any app; on a computer the PDF downloads. If PDF creation is not supported, the print dialog opens: choose <b>Save as PDF</b>.'],['8. Extras &amp; Indian designs','Open <b>✨ Extras</b> in the editor to add a <b>cover page</b> with tagline and photo, a diagonal <b>watermark</b>, <b>optional add-ons</b> (shown separately, not in the total) and your hand-drawn <b>signature</b>. The <b>Indian Celebrations</b> templates (Sangeet, Haldi, Baby Shower, Mundan, Bridal Makeup, Mehendi, Mandap Decor, Catering, DJ &amp; Baraat) come with matching designs: <b>Royal Maroon, Kerala Kasavu, Marigold Haldi, Peacock Teal</b> and <b>Rangoli Festive</b>.'],['9. Invoice / Bill &amp; editing fields','On the template page switch between <b>Quotation</b> and <b>Invoice / Bill</b>. Invoice templates (Professional, GST Tax Invoice, Cash Memo, Proforma, Photography, Clinic, IT, Interior, Fee Receipt, Event, Bridal and Royal designs) include line items, discount, CGST/SGST or IGST, amount in words, amount received, balance due and an automatic <b>PAID</b> stamp. After choosing a template you pick a design, then edit every detail. In both sections use <b>✏️ Edit headings &amp; fields</b> to rename any heading or column, and <b>Extra details</b> to add your own fields. To remove one of your saved templates tap ✕ next to it.'],['10. My Documents, clients &amp; search','Tap <b>Save</b> (or press Ctrl+S) to store the document in <b>My Documents</b>, where you can set its status (Draft, Sent, Accepted, Paid), reopen it, copy it or delete it. The summary shows your quotation and invoice counts and the total <b>outstanding</b> balance. Save clients with <b>+ Save client</b> and pick them again from <b>Saved clients</b>. Use the search box on the template page to find any template instantly.'],['11. Tips &amp; troubleshooting','Use <b>‹ Back</b>, the phone back button or the <b>QuoteCraft</b> title to return to the templates. Quotation numbers (QC-001, QC-002…) are created automatically for each new template. Clearing browser data removes saved work, so export a backup regularly. Very large images can fill the storage; use smaller pictures if you see a storage message. Textures may look slightly different in PDF.']].map((h,i)=>`<details data-id="h${i}"><summary>${h[0]}</summary><div class="hp">${h[1]}</div></details>`).join('')}<div class="row mt-6"><button class="bt" onclick="VIEW='edit';er();pvr()">Continue my last quotation \u2192</button><button class="bt" onclick="ex()">Export backup</button><button class="bt" onclick="$('#fj').click()">Import backup</button></div><div class="row mt-3" style="flex-wrap:wrap"><button class="bt" onclick="$('#fp').click()">+ Import template pack</button><button class="bt" onclick="exPack()">Export my templates</button></div>${PACKS.map((p,i)=>`<div class="sv" style="margin-top:8px"><div><b class="text-sm">${esc(p.name||'Template pack')}</b><div class="td">${(p.quotes||[]).length} quotation \u00b7 ${(p.invoices||[]).length} invoice \u00b7 ${(p.designs||[]).length} designs</div></div><button class="bt" onclick="if(confirm('Remove this pack?'))rmPack(${i})">\u2715</button></div>`).join('')}`}

function rmbg(){const src=S.studio.logo;if(!src)return toast('Upload a logo first');LOGO0=LOGO0||src;const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),W=c.width=im.width,H=c.height=im.height,x=c.getContext('2d');x.drawImage(im,0,0);const d=x.getImageData(0,0,W,H),px=d.data,r0=px[0],r1=px[1],r2=px[2],tol=90,seen=new Uint8Array(W*H),st=[];for(let i=0;i<W;i++)st.push(i,(H-1)*W+i);for(let j=0;j<H;j++)st.push(j*W,j*W+W-1);while(st.length){const p=st.pop();if(seen[p])continue;const o=p*4;if(Math.abs(px[o]-r0)+Math.abs(px[o+1]-r1)+Math.abs(px[o+2]-r2)>tol)continue;seen[p]=1;px[o+3]=0;const cx=p%W;if(cx>0)st.push(p-1);if(cx<W-1)st.push(p+1);if(p>=W)st.push(p-W);if(p<W*(H-1))st.push(p+W)}x.putImageData(d,0,0);ed(()=>S.studio.logo=c.toDataURL('image/png'));toast('Background removed')};im.src=src}
